# `gcloud builds submit --tag` can't pass build args, and Vite needs VITE_* at build time.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}
      - --build-arg=VITE_API_URL=${_VITE_API_URL}
      - --build-arg=VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg=VITE_SUPABASE_PUBLIC_KEY=${_VITE_SUPABASE_PUBLIC_KEY}
      - .
images:
  - ${_IMAGE}
