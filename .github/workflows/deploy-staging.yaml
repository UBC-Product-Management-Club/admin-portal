name: Deploy (staging)

# Same convention as pmc-portal-be: main goes to staging automatically once CI passes.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_deploy.yaml
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
